name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: Build + Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build SmartCue.sln -c Release

      - name: Test
        run: dotnet test SmartCue.sln -c Release --no-build

  publish:
    name: Publish (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: build-test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish (self-contained single-file)
        run: dotnet publish src\StagePlayout.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Copy FFmpeg nativo
        shell: pwsh
        run: Copy-Item thirdparty\FFmpeg publish\FFmpeg -Recurse -Force

      - name: Zip portátil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive -Path publish\* -DestinationPath release-assets\SmartPlayCue-win64.zip -Force

      - name: Pack módulo Companion
        working-directory: companion-module-smartplaycue
        run: npm pack
        env:
          CI: 'true'

      - name: Nome amigável do módulo
        shell: pwsh
        working-directory: companion-module-smartplaycue
        run: |
          $pack = Get-ChildItem *.tgz | Select-Object -First 1
          Copy-Item $pack.FullName "Companion-Module-Smart.Play.Cue-versao-actual.tgz"

      - name: Instalador Inno Setup (opcional)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          try {
            Invoke-WebRequest "https://files.jrsoftware.org/is/6/innosetup-6.4.3.exe" -OutFile "$env:TEMP\innosetup.exe"
            Start-Process "$env:TEMP\innosetup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -Wait
          } catch { Write-Host "Download do Inno falhou" }
          $iscc = @("$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe", "C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($iscc) {
            & $iscc installer\setup.iss
            Write-Host "Instalador gerado em dist\"
          } else {
            Write-Host "Inno Setup nao disponivel - instalador fica de fora desta release"
          }
          exit 0

      - name: GitHub Release (tag)
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/SmartPlayCue-win64.zip
            dist/SmartPlayCue-Setup-*.exe
            companion-module-smartplaycue/*.tgz
          generate_release_notes: true

      - name: Limpar assets antigos normalizados
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; "User-Agent" = "ci" }
          try {
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" -Headers $headers
            foreach ($a in $rel.assets) {
              if ($a.name -like "Companion.Module.*") {
                Invoke-RestMethod -Method Delete -Uri $a.url -Headers $headers | Out-Null
                Write-Host "removido: $($a.name)"
              }
            }
          } catch { Write-Host "limpeza: $_" }
          exit 0
